name: Verify board canonical names on Linux

on:
  push:
    branches: [verify-board-15349-linux]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'Jun516/qwen-code'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      NO_COLOR: '1'
      BOARD_LINUX_REPORT: ${{ github.workspace }}/.qwen/verification/board-linux-result.json
    steps:
      - name: Check out the verifier-only child of the PR head
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22.18.0'
      - name: Install the pinned dependency tree
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --reporter=append-only
      - name: Build the workspace
        run: npm run build
      - name: Bundle the CLI
        run: npm run bundle
      - name: Check real board paths and case controls
        run: node .github/scripts/verify-board-canonical-linux.mjs
      - name: Upload the exact-commit verification report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: board-linux-15349
          path: .qwen/verification/board-linux-result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
